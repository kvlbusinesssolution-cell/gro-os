services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Bound to loopback only, on a host port set via APP_HOST_PORT — this VPS
    # already runs several other services on 3000-3010/3020/3022/3200-3204/
    # 4200/5000/8000-8002/etc (surveyed via `ss -tlnp` before picking this),
    # so never assume 3000 is free on a shared host. The real public entry
    # point is this host's existing native nginx (already fronting several
    # other domains on 80/443), reverse-proxying
    # growthos.kvlbusinesssolutions.com to 127.0.0.1:${APP_HOST_PORT} — not a
    # second proxy/TLS stack in Docker, which would fight nginx for the port.
    ports:
      - "127.0.0.1:${APP_HOST_PORT:?set APP_HOST_PORT in your .env to a free host port, e.g. 3030}:3000"
    environment:
      # Real service-to-service wiring — hostnames are the compose service
      # names below, resolved via Docker's internal DNS. Postgres/Redis are
      # NOT published to the host at all (see those services below) — this
      # host already runs a native Postgres on 5432 and native+dockerized
      # Redis on 6379, so publishing the same ports here would either
      # conflict or silently shadow the wrong instance. Container-to-
      # container traffic on the compose network doesn't need host
      # publishing regardless.
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your .env file, e.g. openssl rand -hex 24}@postgres:5432/kvl_growthos?schema=public"
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      # Generate a real secret for local/self-hosted use:
      #   openssl rand -base64 32
      AUTH_SECRET: "${AUTH_SECRET:?set AUTH_SECRET in your .env file, e.g. openssl rand -base64 32}"
      # Real public URL of this deployment — required so Auth.js generates
      # correct callback/redirect URLs when running behind the host's nginx
      # instead of being accessed directly. Leave unset for plain localhost
      # use with no reverse proxy.
      AUTH_URL: ${AUTH_URL:-}
      # Always true in this compose topology: the app is only ever reached
      # through the host's reverse proxy (nginx) or a local port-forward,
      # never directly from the internet, so Auth.js can safely trust the
      # X-Forwarded-Host header the proxy sets.
      AUTH_TRUST_HOST: "true"
      # OAuth login providers (src/auth.ts / src/lib/auth/oauth-providers.ts).
      # Each "Sign in with X" button only appears once its own pair of env
      # vars below is actually set — none configured is a fully valid state.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_ENTRA_ID_CLIENT_ID: ${MICROSOFT_ENTRA_ID_CLIENT_ID:-}
      MICROSOFT_ENTRA_ID_CLIENT_SECRET: ${MICROSOFT_ENTRA_ID_CLIENT_SECRET:-}
      MICROSOFT_ENTRA_ID_TENANT_ID: ${MICROSOFT_ENTRA_ID_TENANT_ID:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      # The 5 independent AES-256-GCM key domains — see .env.example for what
      # each protects. All optional: each feature honestly degrades to
      # "not configured" until its own key is set, same as running without
      # Docker at all.
      AGENT_MEMORY_ENCRYPTION_KEY: ${AGENT_MEMORY_ENCRYPTION_KEY:-}
      INTEGRATION_TOKEN_ENCRYPTION_KEY: ${INTEGRATION_TOKEN_ENCRYPTION_KEY:-}
      SECRETS_MANAGER_ENCRYPTION_KEY: ${SECRETS_MANAGER_ENCRYPTION_KEY:-}
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:-}
      TWO_FACTOR_SECRET_ENCRYPTION_KEY: ${TWO_FACTOR_SECRET_ENCRYPTION_KEY:-}
      # AI agent runtime — paid provider + free fallback chain (see
      # src/lib/ai/fallback.ts). All optional: with none set, AI features
      # honestly show "not connected" rather than fabricating output.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # OpenRouter rotates which model backs its free tier — override without
      # a code change/rebuild if the hardcoded default in
      # src/lib/ai/providers/openrouter-provider.ts goes stale again.
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      # Auth emails (verification, sign-in alerts, invites, magic links —
      # src/lib/email.ts). Without EMAIL_SERVER set, these silently fall back
      # to a "[DEV] Email to ..." console log instead of a real send.
      EMAIL_SERVER: ${EMAIL_SERVER:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Outreach Assistant's real send path (src/lib/outreach/email-provider.ts)
      # and its webhook signature verification.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      # KVL sales inbox reply sync (src/lib/business-development/kvl-reply-sync-job.ts)
      # — present in .env but was missing from this whitelist, so the job
      # skipped every run with "not configured yet" despite real credentials.
      KVL_IMAP_HOST: ${KVL_IMAP_HOST:-}
      KVL_IMAP_PORT: ${KVL_IMAP_PORT:-}
      KVL_IMAP_USER: ${KVL_IMAP_USER:-}
      KVL_IMAP_PASSWORD: ${KVL_IMAP_PASSWORD:-}
      KVL_IMAP_SECURE: ${KVL_IMAP_SECURE:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # /api/health is being built by a parallel monitoring task and did not
    # exist yet as of this file being written — this points at its
    # documented contract (GET /api/health -> 200 healthy / 503 degraded).
    # If it isn't merged yet, swap the path back to "/" temporarily.
    #
    # "127.0.0.1", not "localhost": this image's server only binds IPv4
    # (HOSTNAME=0.0.0.0 in the Dockerfile), but Alpine's wget resolves
    # "localhost" to the IPv6 loopback (::1) first and doesn't fall back —
    # that made every check fail with "connection refused" against a
    # perfectly healthy server (confirmed via `ss -tlnp` showing only a
    # 0.0.0.0:3000 listener, no ::3000).
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      # Real uploaded-document persistence (src/lib storage read/write path)
      # so files survive a container recreate — mirrors .gitignore's
      # /storage/documents exclusion from version control.
      - storage_documents:/app/storage/documents

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your .env file, e.g. openssl rand -hex 24}"
      POSTGRES_DB: kvl_growthos
    # Loopback-only, on a free host port set via POSTGRES_HOST_PORT — this
    # host's own native Postgres already owns 5432, so this must be a
    # different port. Published (rather than left fully internal) so
    # `prisma migrate deploy` can run from the VPS host itself, the same way
    # this repo's own CI does it (see .github/workflows/deploy.yml) — never
    # from inside the minimal production image, which doesn't ship the
    # Prisma CLI.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:?set POSTGRES_HOST_PORT in your .env to a free host port, e.g. 5478}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    # No host port published — same reasoning as postgres above.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  storage_documents:
